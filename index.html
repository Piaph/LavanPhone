<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<title>ЛаванPhone</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

frame{
    border:none;
}

</style>

</head>

<frameset rows="95,*,42" border="0">

    <!-- ВЕРХ -->
    <frame
        src="top.html"
        name="top"
        noresize
        scrolling="no"
    >

    <!-- ЦЕНТР -->
    <frameset cols="330,*" border="0">

        <frame
            src="menu.html"
            name="menu"
            noresize
            scrolling="no"
        >

        <frame
            src="content.html"
            name="main"
        >

    </frameset>

    <!-- НИЗ -->
    <frame
        src="footer.html"
        name="footer"
        noresize
        scrolling="no"
    >

</frameset>

</html>
