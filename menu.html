<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Меню</title>

<style>

/* Убираем прокрутку */

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* Фон */

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#fdf6ec,#f3ece1);
}

/* Контейнер меню */

.menu-box{

    width:260px; /* меню стало уже */

    height:100vh;

    box-sizing:border-box;

    padding:18px;

    background:rgba(255,255,255,0.75);

    backdrop-filter:blur(12px);

    border-radius:0 22px 22px 0;

    box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

/* Заголовок */

h3{
    margin-top:0;

    text-align:center;

    font-size:24px;

    color:#222;

    margin-bottom:22px;
}

/* Список */

ul{
    list-style:none;

    padding:0;

    margin:0;
}

/* Пункты */

li{
    margin-bottom:12px;
}

/* Кнопки */

a{

    display:block;

    text-decoration:none;

    background:white;

    padding:14px;

    border-radius:16px;

    color:#222;

    font-size:16px;

    font-weight:bold;

    transition:0.3s;

    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

a:hover{

    transform:translateX(4px);

    background:#111;

    color:white;

    box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

/* Иконки */

.icon{
    margin-right:8px;
}

</style>
</head>

<body>

<div class="menu-box">

<h3>📱 Меню</h3>

<ul>

<li>
<a target="main" href="content.html">
<span class="icon">🏠</span>
Главная
</a>
</li>

<li>
<a target="main" href="about.html">
<span class="icon">ℹ️</span>
О сайте
</a>
</li>

<li>
<a target="main" href="author.html">
<span class="icon">👨‍💻</span>
Об авторе
</a>
</li>

</ul>

</div>

</body>
</html>
