<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Top</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;

    background:rgba(255,255,255,0.82);

    backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(0,0,0,0.08);
}

/* ШАПКА */

.header{

    width:100%;
    height:95px;

    position:relative;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;
}

/* ЛОГО */

.logo{

    display:flex;
    align-items:center;
    gap:12px;

    font-size:32px;

    font-weight:bold;

    color:#111;

    margin-bottom:4px;
}

/* КАРТИНКА */

.logo-img{

    width:42px;
    height:42px;

    object-fit:contain;

    border-radius:12px;
}

/* БЕГУЩАЯ СТРОКА */

.marquee-box{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:24px;

    overflow:hidden;

    background:#111;

    display:flex;
    align-items:center;
}

/* ЛЕНТА */

.marquee-track{

    display:flex;

    width:max-content;

    animation:scroll 20s linear infinite;
}

/* ТЕКСТ */

.marquee{

    display:flex;

    white-space:nowrap;

    color:white;

    font-size:11px;

    font-weight:bold;
}

/* ОТСТУПЫ */

.marquee span{
    margin-right:70px;
    padding-left:20px;
}

/* БЕСКОНЕЧНАЯ АНИМАЦИЯ */

@keyframes scroll{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}

</style>

</head>

<body>

<div class="header">

    <div class="logo">

        <img src="logo.png" class="logo-img">

        <span>ЛаванPhone</span>

    </div>

    <div class="marquee-box">

        <div class="marquee-track">

            <!-- ПЕРВАЯ КОПИЯ -->

            <div class="marquee">

                <span>🔥 Лучшие тарифы 2026</span>

                <span>📶 МТС • Билайн • Tele2 • МегаФон</span>

                <span>💰 Быстрое и удобное сравнение</span>

                <span>⚡ Современный каталог мобильных операторов</span>

                <span>🚀 ЛаванPhone</span>

            </div>

            <!-- ВТОРАЯ КОПИЯ -->

            <div class="marquee">

                <span>🔥 Лучшие тарифы 2026</span>

                <span>📶 МТС • Билайн • Tele2 • МегаФон</span>

                <span>💰 Быстрое и удобное сравнение</span>

                <span>⚡ Современный каталог мобильных операторов</span>

                <span>🚀 ЛаванPhone</span>

            </div>

        </div>

    </div>

</div>

</body>

</html>
