<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Top</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;

    background:rgba(255,255,255,0.82);

    backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(0,0,0,0.08);
}

/* ШАПКА */

.header{

    width:100%;
    height:95px;

    position:relative;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;
}

/* ЗАГОЛОВОК */

.logo{

    font-size:32px;

    font-weight:bold;

    color:#111;

    margin-bottom:4px;
}

/* ПОДЗАГОЛОВОК */

.subtitle{

    font-size:13px;

    color:#666;
}

/* БЕГУЩАЯ СТРОКА */

.marquee-box{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:24px;

    overflow:hidden;

    background:#111;

    display:flex;
    align-items:center;
}

/* ТЕКСТ */

.marquee{

    display:inline-block;

    white-space:nowrap;

    color:white;

    font-size:11px;

    font-weight:bold;

    padding-left:100%;

    animation:marquee 18s linear infinite;
}

/* ОТСТУПЫ */

.marquee span{
    margin-right:70px;
}

/* АНИМАЦИЯ */

@keyframes marquee{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-100%);
    }
}

</style>

</head>

<body>

<div class="header">

    <div class="logo">
        📱 ЛаванPhone
    </div>

    <div class="marquee-box">

        <div class="marquee">

            <span>🔥 Лучшие тарифы 2026</span>

            <span>📶 МТС • Билайн • Tele2 • МегаФон</span>

            <span>💰 Быстрое и удобное сравнение</span>

            <span>⚡ Современный каталог мобильных операторов</span>

            <span>🚀 ЛаванPhone</span>

            <span>🔥 Лучшие тарифы 2026</span>

            <span>📶 МТС • Билайн • Tele2 • МегаФон</span>

        </div>

    </div>

</div>

</body>

</html>
